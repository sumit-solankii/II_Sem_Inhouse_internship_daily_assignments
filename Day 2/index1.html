<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        * {
            margin: 2px 5px 2px 5px;
            padding: 0;
            /* background-color: white; */
        }
        body {
            margin: 0px 350px 0px 350px;
            background-color: burlywood;
            justify-content: center;
            align-items: center;
            display: flex;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 0 1px 10px  black;
        }
        #container {
            background-color: burlywood;
            /* background: white; */
        }
        h1 {
            margin-top: 12px;
            text-align: center;
            color: blue;
        }
        .label {
            font-size: 25px;
            display: block;
            margin: 5px 0 5px;
        }
        .input-box , .select-box, .textarea-box {
            border: 1px solid black;
            border-radius: 5px;
            font-size: 20px;
            box-shadow: 0 1px 4px black;
        }
        .radio-group, .checkbox-group {
            margin: 8px 0;
            /* display: block; */
        }
        .radio-group label , .checkbox-group label {
            display: block;
            margin: 5px 0;
            cursor: pointer;
        }
        .btn {
            color: white;
            font-size: 15px;
            background: blue;
            margin-top: 1px;
            margin-left: 30px;
            margin-bottom: 12px;
            padding: 12px;
            width: 40%;
            cursor: pointer;
            border-radius: 20px;
            border: 2px solid black;
            box-shadow: 0 1px 4px black;
        }
        .btn:hover {
            color: burlywood;
            background-color: rgb(5, 5, 187);
        }
        .textarea-group {
            font-size: 20px;
            display: block;
            width: 100%;
            height: 100%;
            height: 100px;
            size: 100px;
            border-radius: 10px;
            border: 2px solid black;
            box-shadow: 0 1px 4px black;
            /* cursor: pointer; */
            /* columns: 5; */
            /* rows: 5; */
        }
        .textarea-group::placeholder {
            justify-content: center;
            text-align: center;
            display: flex;
            margin-top: 10px;
        }
        /* * {
            background-color: white;
        } */
    </style>
</head>
<body>
    <div id="container">
    <h1>Student Registration Form</h1>
    <form>
        <label class="label"><b>Full Name</b></label>
        
        <input class="input-box" placeholder="Enter your name" type="text" required>
        <br><br>
        <label class="label"><b>Email</b></label>
        
        <input class="input-box" placeholder="Enter your email" type="email" required>
        <br><br>
        <label class="label"><b>Password</b></label>
        
        <input class="input-box" placeholder="Create password" type="password" required>
        <br><br>
        <label class="label"><b>Mobile Number</b></label>
        
        <input class="input-box" placeholder="Enter mobile number" type="tel" maxlength="10" required>
        <br><br>
        <label class="label"><b>Date of Birth</b></label>
        
        <input class="input-box" type="date">
        <br><br>
        <label class="label"><b>Gender</b></label>
        
        <div class="radio-group">
        <label><input type="radio" name="Gender"> Male <br></label>
        <label><input type="radio" name="Gender"> Female <br></label>
        <label><input type="radio" name="Gender"> Other <br></label>
        <br></div>
        <label class="label"><b>Select Course</b></label>
        
        <select class="select-box">
            <option>--Select Course--</option>
            <option>B.Tech CSE</option>
            <option>B.Tech IT</option>
            <option>B.Tech DS</option>
            <option>B.Tech AI</option>
        </select>
        <br><br>
        <label class="label"><b>Skills</b></label>
        
        <div class="checkbox-group">
        <label><input type="checkbox">HTML <br></label>
        <label><input type="checkbox">CSS <br></label>
        <label><input type="checkbox">JavaScript <br></label>
        <label><input type="checkbox">PHP <br></label>
        <br></div>
        <label class="label"><b>Upload Resume</b></label>
        
        <input class="input-box" type="file">
        <br><br>
        <label class="label"><b>About Yourself</b></label>
        
        <textarea class="textarea-group" placeholder="Write something about yourself"></textarea>
        <br><br>
        <input class="btn" type="submit" value="register">
        <input class="btn" type="reset" value="reset">
    </form>
    </div>
</body>
</html>
